name: Deploy
description: Builds and tests the contract, then deploys it with no maintenance authority.

inputs:
  network:
    description: Network to deploy to, which scripts/deploy.ts has to know
    required: true
  seed:
    description: Seed of the wallet that pays the fee
    required: true
  blockfrost-project-id:
    description: Blockfrost token for the network, which preprod and mainnet need
    required: false
    default: ""
  version:
    description: >
      A published release to deploy, such as 0.3.0. It is built from its tag and has to match
      the package on npm byte for byte. Leave it empty to deploy the checked-out source.
    required: false
    default: ""
  wallet-state:
    description: >
      A file of the wallet's saved sync, from the sync action, to resume from. Leave it empty to
      sync from genesis.
    required: false
    default: ""
  sync-minutes:
    description: How long the wallet may take to sync, or empty for the script's default
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    # The deploy script and its checks always come from the checked-out source.
    - name: Build and test the deploy tooling
      shell: bash
      run: |
        npm ci
        npm run release
    - name: Check the version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version: $VERSION"; exit 1; }'
    - name: Check out the release
      if: inputs.version != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/v${{ inputs.version }}
        path: deploy-source
        persist-credentials: false
    - name: Build and test the release
      if: inputs.version != ''
      shell: bash
      working-directory: deploy-source
      env:
        VERSION: ${{ inputs.version }}
      run: |
        [[ "$(node -p 'require("./package.json").version')" == "$VERSION" ]] || {
          echo "The tag's package.json isn't version $VERSION"; exit 1; }
        npm ci
        npm run release
    # Integrators prove against the npm package, so deploy exactly its keys, and only when the
    # release's source reproduces them.
    - name: Match the release to npm
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        npm_dir="$RUNNER_TEMP/npm-package"
        mkdir -p "$npm_dir"
        npm pack "@shieldedpools/contracts@$VERSION" --pack-destination "$npm_dir" --silent
        tar -xzf "$npm_dir"/*.tgz -C "$npm_dir"
        diff -r "$npm_dir/package/contract/managed/shielded-pools" deploy-source/contract/managed/shielded-pools
        echo "CONTRACT_DIR=$GITHUB_WORKSPACE/deploy-source/contract/managed/shielded-pools" >> "$GITHUB_ENV"
    - name: Start the proof server
      shell: bash
      run: |
        docker compose up -d --wait proof-server
        curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:6300/version
    - name: Deploy
      shell: bash
      env:
        MIDNIGHT_NETWORK: ${{ inputs.network }}
        MIDNIGHT_SEED: ${{ inputs.seed }}
        BLOCKFROST_PROJECT_ID: ${{ inputs.blockfrost-project-id }}
        MIDNIGHT_WALLET_STATE: ${{ inputs.wallet-state }}
        MIDNIGHT_SYNC_MINUTES: ${{ inputs.sync-minutes }}
      run: |
        npm run -s deploy > deployment.txt
        { echo '```'; cat deployment.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
